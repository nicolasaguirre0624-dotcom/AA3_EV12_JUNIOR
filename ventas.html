<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>D'Aroma - Ventas</title><link rel="stylesheet" href="css/styles.css"></head><body><header><h1>D'Aroma <small>Perfumería</small></h1><nav><a href="index.html">Inicio</a><a href="productos.html">Productos</a><a href="ventas.html">Ventas</a></nav></header><main>
<div id="estado" class="msg"></div>
<section class="card"><h2>Registro de venta</h2>
<form id="form"><div class="fila">
<label>Código (uuid)<input id="codigo" readonly></label>
<label>Vendedor<select id="vendedor" required></select></label>
<label>Fecha<input type="date" id="fecha" required></label></div>
<div class="fila"><label>Producto<select id="producto"></select></label>
<label>Cantidad<input type="number" id="cantidad" min="1" step="1" value="1"></label>
<button type="button" id="btn-agregar" class="btn">Agregar producto</button></div>
<div id="msg" class="msg"></div>
<h3>Resumen de la venta</h3><p id="resumen-info"></p>
<div class="tabla"><table><thead><tr><th>Producto</th><th>Cantidad</th><th>Precio unitario</th><th>Subtotal</th><th></th></tr></thead><tbody id="items"></tbody>
<tfoot><tr><th colspan="3">TOTAL</th><th id="total">$0</th><th></th></tr></tfoot></table></div>
<p><button type="submit" id="btn-guardar" class="btn">Guardar venta</button> <button type="button" id="btn-cancelar" class="btn gris">Cancelar</button></p></form></section>
<section class="card"><h2>Ventas registradas</h2>
<div class="tabla"><table><thead><tr><th>Id</th><th>Producto</th><th>Cant.</th><th>Precio unit.</th><th>Vendedor</th><th>Subtotal</th><th>Acciones</th></tr></thead><tbody id="ventas"></tbody>
<tfoot><tr><th colspan="5">TOTAL GENERAL</th><th id="total-general">$0</th><th></th></tr></tfoot></table></div>
<div id="detalle" class="detalle" hidden></div></section>
</main><footer>AA3-EV12 · Consumo de API y CRUD de ventas · D'Aroma</footer>
<script src="js/app.js"></script><script src="js/ventas.js"></script></body></html>
